    url: "https://www.thegreenjournal.com/inpress.rss"
    tier: 1
    category: radonc_journal
  - id: advances_radonc
    name: "Advances in Radiation Oncology"
    url: "https://www.advancesradonc.org/current.rss"
    tier: 2
    category: radonc_journal
  - id: clinical_oncology_rcr
    name: "Clinical Oncology (Royal College of Radiologists)"
    url: "https://www.clinicaloncologyonline.net/current.rss"
    tier: 2
    category: radonc_journal
  - id: brachytherapy
    name: "Brachytherapy"
    url: "https://www.brachyjournal.com/inpress.rss"
    tier: 2
    category: radonc_journal
  - id: semin_radonc
    name: "Seminars in Radiation Oncology"
    url: "https://rss.sciencedirect.com/publication/science/10534296"
    tier: 2
    category: radonc_journal
  - id: ctro
    name: "Clinical and Translational Radiation Oncology"
    url: "https://rss.sciencedirect.com/publication/science/24056308"
    tier: 2
    category: radonc_journal
  - id: phiro
    name: "Physics and Imaging in Radiation Oncology"
    url: "https://rss.sciencedirect.com/publication/science/24056316"
    tier: 3
    category: radonc_journal
  - id: med_phys
    name: "Medical Physics (AAPM)"
    url: "https://aapm.onlinelibrary.wiley.com/feed/24734209/most-recent"
    tier: 3
    category: radonc_journal
  - id: jacmp
    name: "Journal of Applied Clinical Medical Physics"
    url: "https://aapm.onlinelibrary.wiley.com/feed/15269914/most-recent"
    tier: 3
    category: radonc_journal
    enabled: false   # high volume, mostly QA/technical; PubMed query catches the clinically relevant ones

  # ---------------------------------------------------------------- General oncology & medicine
  # The ascopubs.org "etoc" feeds carry no abstract and no date ("Journal of Clinical Oncology, Ahead of
  # Print.") and list papers one to five months after online publication (checked against Crossref on
  # 2026-09-22). PubMed indexes JCO / JCO OP online-first papers the same day with abstracts, so the
  # `jco_all` query in pubmed.yaml is the source for these journals. Re-enable if PubMed misses something;
  # the enrichment step (settings.yaml `enrich`) fills abstracts from Crossref for citation-only items.
  - id: jco
    name: "Journal of Clinical Oncology"
    url: "https://ascopubs.org/action/showFeed?type=etoc&feed=rss&jc=jco"
    tier: 1
    category: oncology_journal
    enabled: false
  - id: jco_op
    name: "JCO Oncology Practice"
    url: "https://ascopubs.org/action/showFeed?type=etoc&feed=rss&jc=op"
    tier: 2
    category: oncology_journal
    enabled: false
  - id: lancet_oncology
    name: "The Lancet Oncology — online first"
    url: "https://www.thelancet.com/rssfeed/lanonc_online.xml"
    tier: 1
    category: oncology_journal
  - id: nejm
