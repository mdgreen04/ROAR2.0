# RSS / Atom sources for ROAR 2.0.
#
# tier:      1 = core radiation oncology or landmark general journals (items get a scoring boost)
#            2 = disease-site journals, high-quality news
#            3 = high-volume or peripheral (only strong keyword hits survive)
# category:  radonc_journal | oncology_journal | site_journal | ai_journal | news | regulatory | preprint | newsletter | podcast
# topic_filter: true  -> the feed is broad (NEJM, JAMA, Nature Medicine, FDA...) and items must match
#                        oncology / radiation keywords (see interests.yaml) to be kept at all.
# enabled:   set false to pause a feed without deleting it.
#
# Feed velocity (items/week) and last-update dates were checked against Feedly's index on 2026-09-15.

feeds:
  # ---------------------------------------------------------------- Radiation oncology journals
  - id: redjournal_inpress
    name: "Int J Radiat Oncol Biol Phys (Red Journal) — in press"
    url: "https://www.redjournal.org/inpress.rss"
    tier: 1
    category: radonc_journal
  - id: redjournal_current
    name: "Int J Radiat Oncol Biol Phys (Red Journal) — current issue"
    url: "https://www.redjournal.org/current.rss"
    tier: 1
    category: radonc_journal
  - id: pro_inpress
    name: "Practical Radiation Oncology — in press"
    url: "https://www.practicalradonc.org/inpress.rss"
    tier: 1
    category: radonc_journal
  - id: pro_current
    name: "Practical Radiation Oncology — current issue"
    url: "https://www.practicalradonc.org/current.rss"
    tier: 1
    category: radonc_journal
  - id: greenjournal_inpress
