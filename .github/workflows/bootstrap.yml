# ROAR 2.0 one-time bootstrap.
#
# Uploaded together with weekly.yml and verify-sources.yml through the GitHub web UI (workflow files
# must be committed by a user account: the Actions token is not allowed to create them). The push
# triggers the job below, which unpacks the rest of the ROAR 2.0 tree (code, config, docs, the
# 2026-09-15 sample digest and state/seen.json) and commits it to the default branch. After it has
# run once this file can be deleted; it only triggers on changes to itself or a manual dispatch.

name: ROAR bootstrap (one-time)

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

