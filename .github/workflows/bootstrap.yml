# ROAR 2.0 one-time bootstrap.
#
# Add this single file to an otherwise empty repository at .github/workflows/bootstrap.yml (upload it
# through the GitHub web UI). The push triggers the job below, which unpacks the whole ROAR 2.0 tree
# (code, config, docs, the 2026-09-15 sample digest and state/seen.json), commits it to the default
# branch and deletes this file. After that the regular workflow (.github/workflows/weekly.yml) is in
# place and runs every Monday. If the push did not trigger it, run it once from the Actions tab.

name: ROAR bootstrap (one-time)

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the ROAR 2.0 tree
