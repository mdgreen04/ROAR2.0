      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sanity check (informational)
        continue-on-error: true
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q

      - name: Commit
        run: |
          git config user.name "roar-bot"
          git config user.email "roar-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to import"; exit 0; fi
          git commit -m "ROAR 2.0: initial import (bootstrap)"
          git push
          echo "## ROAR 2.0 imported — $(git ls-files | wc -l) files on $(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_STEP_SUMMARY"
